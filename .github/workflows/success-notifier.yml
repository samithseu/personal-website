name: Success deployment status notifier

on:
  deployment_status:

jobs:
  notify:
    name: Notify Telegram
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prepare deployment notification
        id: notify_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_REF="${{ github.event.deployment.ref }}"
          RAW_SHA="${{ github.event.deployment.sha || github.sha }}"
          SHORT_SHA="${RAW_SHA:0:7}"
          ENV_NAME="${{ github.event.deployment.environment || github.event.deployment_status.environment }}"

          URL="${{ github.event.deployment_status.environment_url }}"
          if [ -z "$URL" ]; then
            URL="${{ github.event.deployment_status.target_url }}"
          fi

          # Detect branch: Vercel passes commit SHA as deployment ref, so inspect environment and commit branches
          ENV_LOWER="$(echo "$ENV_NAME" | tr '[:upper:]' '[:lower:]')"
          if [ "$ENV_LOWER" = "production" ]; then
            BRANCH="main"
            TITLE="🚀✅ Production Deployment"
            URL="https://samith.dev"
          else
            BRANCH=""
            if [ -n "$RAW_SHA" ]; then
              BRANCH=$(gh api "/repos/${{ github.repository }}/commits/${RAW_SHA}/branches-where-head" --jq '.[].name' 2>/dev/null | grep -v '^main$' | head -n 1 || true)
            fi
            if [ -z "$BRANCH" ]; then
              BRANCH="dev"
            fi
            TITLE="🧪✅ Preview Deployment ($BRANCH)"
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$RAW_SHA" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TITLE: ${{ steps.notify_data.outputs.title }}
          URL: ${{ steps.notify_data.outputs.url }}
          BRANCH: ${{ steps.notify_data.outputs.branch }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.notify_data.outputs.sha }}
          SHORT_SHA: ${{ steps.notify_data.outputs.short_sha }}
        run: |
          node << 'EOF'
          (async () => {
            const token = process.env.TELEGRAM_TOKEN;
            const chatId = process.env.TELEGRAM_TO;
            const title = process.env.TITLE;
            const url = process.env.URL;
            const branch = process.env.BRANCH;
            const repo = process.env.REPO;
            const sha = process.env.SHA;
            const shortSha = process.env.SHORT_SHA;

            if (!token || !chatId) {
              console.error('Error: TELEGRAM_TOKEN and TELEGRAM_TO secrets must be configured.');
              process.exit(1);
            }

            const escapeHtml = (str) =>
              String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');

            const repoUrl = `https://github.com/${repo}`;
            const commitUrl = `https://github.com/${repo}/commit/${sha}`;

            const htmlMessage = [
              `<p><b>${escapeHtml(title)}</b></p>`,
              '<p>',
              `🔗 <b>Live URL:</b> <tg-button type="url" url="${escapeHtml(url)}">Check it out!</tg-button> <tg-button type="copy_text" text="${escapeHtml(url)}">URL</tg-button><br>`,
              `🌿 <b>Branch:</b> <tg-button type="copy_text" text="${escapeHtml(branch)}">${escapeHtml(branch)}</tg-button><br>`,
              `📦 <b>Repo:</b> <tg-button type="url" url="${escapeHtml(repoUrl)}">${escapeHtml(repo)}</tg-button><br>`,
              `🔖 <b>Commit:</b> <tg-button type="url" url="${escapeHtml(commitUrl)}">${escapeHtml(shortSha)}</tg-button> <tg-button type="copy_text" text="${escapeHtml(shortSha)}">Short Hash</tg-button> <tg-button type="copy_text" text="${escapeHtml(sha)}">Full Hash</tg-button>`,
              '</p>'
            ].join('\n');

            const payload = {
              chat_id: chatId,
              rich_message: {
                html: htmlMessage,
              },
            };

            const endpoint = `https://api.telegram.org/bot${token}/sendRichMessage`;

            const res = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(payload),
            });

            const data = await res.json();
            if (!res.ok || !data.ok) {
              console.error('Telegram API error:', JSON.stringify(data, null, 2));
              process.exit(1);
            }

            console.log(`Telegram rich message sent successfully! Message ID: ${data.result?.message_id}`);
          })().catch((err) => {
            console.error('Unexpected error:', err);
            process.exit(1);
          });
          EOF
