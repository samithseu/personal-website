name: Success deployment status notifier

on:
  deployment_status:

jobs:
  notify:
    name: Notify Telegram
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prepare deployment notification
        id: notify_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_REF="${{ github.event.deployment.ref }}"
          RAW_SHA="${{ github.event.deployment.sha || github.sha }}"
          SHORT_SHA="${RAW_SHA:0:7}"
          ENV_NAME="${{ github.event.deployment.environment || github.event.deployment_status.environment }}"

          URL="${{ github.event.deployment_status.environment_url }}"
          if [ -z "$URL" ]; then
            URL="${{ github.event.deployment_status.target_url }}"
          fi

          # Detect branch: Vercel passes commit SHA as deployment ref, so inspect environment and commit branches
          ENV_LOWER="$(echo "$ENV_NAME" | tr '[:upper:]' '[:lower:]')"
          if [ "$ENV_LOWER" = "production" ]; then
            BRANCH="main"
            TITLE="🚀 Production Deployment Succeeded!"
            URL="https://samith.dev"
          else
            BRANCH=""
            if [ -n "$RAW_SHA" ]; then
              BRANCH=$(gh api "/repos/${{ github.repository }}/commits/${RAW_SHA}/branches-where-head" --jq '.[].name' 2>/dev/null | grep -v '^main$' | head -n 1 || true)
            fi
            if [ -z "$BRANCH" ]; then
              BRANCH="dev"
            fi
            TITLE="🧪 Preview Deployment Succeeded ($BRANCH)!"
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$RAW_SHA" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: html
          disable_web_page_preview: false
          message: |
            <b>${{ steps.notify_data.outputs.title }}</b>

            🔗 <b>Live URL:</b> <tg-button type="url" url="${{ steps.notify_data.outputs.url }}">${{ steps.notify_data.outputs.url }}</tg-button>
            🌿 <b>Branch:</b> <tg-button type="copy_text" text="${{ steps.notify_data.outputs.branch }}">${{ steps.notify_data.outputs.branch }}</tg-button>
            📦 <b>Repo:</b> <tg-button type="url" url="https://github.com/${{ github.repository }}">${{ github.repository }}</tg-button>
            🔖 <b>Commit:</b> <tg-button type="url" url="https://github.com/${{ github.repository }}/commit/${{ steps.notify_data.outputs.sha }}">${{ steps.notify_data.outputs.short_sha }}</tg-button> <tg-button type="copy_text" text="${{ steps.notify_data.outputs.short_sha }}">${{ steps.notify_data.outputs.short_sha }}</tg-button>
